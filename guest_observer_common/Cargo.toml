[package]
name = "guest_observer_common"
description = "The event structs and map layouts the observer's eBPF programs and its userspace share."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
# Userspace: lets aya copy the structs in and out of BPF maps.
user = ["aya"]

[dependencies]
aya = { version = "0.16.0", optional = true, default-features = false }
