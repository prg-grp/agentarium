// The command plane between the app (host) and the guest supervisor.
//
// The app connects to the supervisor on vsock port 700 (see PORT in src/lib.rs); only
// root can listen on ports up to 1023 in the guest. Each message is a big-endian u32
// length followed by the encoded message. The guest says Hello first; the app answers
// with Start, which decides what the boot runs. Nothing runs before that.
//
// The guest has two serial consoles: the session runs alone on hvc1 (the app's Terminal
// tab); hvc0 carries the kernel, systemd and supervisor output (the read-only Logs tab).
//
// In agent mode the supervisor also reports Status every STATUS_INTERVAL (see
// src/lib.rs) and at once when the agent starts or exits. The app keeps only the latest
// report; nothing is stored.
syntax = "proto3";

package agent_toolbox.command_plane.v1;

// App to guest.
message HostMessage {
  oneof kind {
    Start start = 1;
    Stop stop = 2;
    Resize resize = 3;
  }
}

// Guest to app.
message GuestMessage {
  oneof kind {
    Hello hello = 1;
    ProvisionFinished provision_finished = 2;
    StartFailed start_failed = 3;
    Status status = 4;
  }
}

// Sent by the supervisor on every new connection.
message Hello {
  uint32 protocol_version = 1;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  // Mounts the shared folders, then runs the launch command as the unprivileged user,
  // again whenever it exits.
  MODE_AGENT = 1;
  // Mounts the shared folders, then runs a root login shell, again whenever it exits.
  MODE_MAINTENANCE = 2;
  // Runs the provisioning script as root, reports ProvisionFinished, then powers off.
  MODE_PROVISION = 3;
}

// What this boot runs. Only the first Start of a boot counts.
message Start {
  Mode mode = 1;
  // Agent mode only.
  Launch launch = 2;
  // Provision mode only: a bash script.
  string provision_script = 3;
  // Agent and maintenance modes: set for the session, after the supervisor's defaults.
  repeated EnvVar environment = 4;
  // Agent and maintenance modes: the shared folders, mounted before the session starts.
  // If one can't be mounted, the supervisor sends StartFailed and powers off.
  repeated Mount mounts = 5;
}

// The agent's command, run directly (not through a shell).
message Launch {
  string command = 1;
  repeated string arguments = 2;
  string working_directory = 3;
}

message EnvVar {
  string name = 1;
  string value = 2;
}

// A host folder, shared through the virtio-fs device tagged SHARE_TAG (see src/lib.rs).
message Mount {
  // The folder's name inside that share.
  string share = 1;
  // Where it appears in the guest; absolute.
  string guest_path = 2;
  // The Mac enforces read-only access; the guest mounts it read-only too.
  bool read_only = 3;
}

// Shuts the guest down cleanly.
message Stop {}

// The size of the app's terminal view, for the session console (hvc1). May arrive
// before or after Start; the latest one counts.
message Resize {
  uint32 columns = 1;
  uint32 rows = 2;
}

message ProvisionFinished {
  // The script's exit code; -1 if it couldn't run or was killed by a signal.
  int32 exit_code = 1;
}

// The boot couldn't prepare its session (e.g. a shared folder didn't mount), so nothing
// was started. The supervisor powers off after sending it.
message StartFailed {
  string reason = 1;
}

// Agent mode only: the guest's resource use and the state of its processes. CPU times
// are running totals; the app computes rates from two consecutive reports.
message Status {
  // The guest's CLOCK_MONOTONIC when the report was taken, in microseconds.
  uint64 monotonic_usec = 1;
  // Busy time of all vCPUs together, since boot.
  uint64 vm_cpu_usec = 2;
  // MemTotal - MemAvailable.
  uint64 vm_memory_used_bytes = 3;
  // MemTotal: what the guest sees, a little less than the VM's memory.
  uint64 vm_memory_total_bytes = 4;
  bool agent_running = 5;
  // How often the agent was started again during this boot.
  uint32 agent_restarts = 6;
  // Absent until the agent first exits.
  AgentExit agent_last_exit = 7;
  // The agent's cgroup; absent if it couldn't be set up.
  AgentUsage agent_usage = 8;
  CollectorState collector = 9;
}

message AgentExit {
  // -1 if it was ended by a signal.
  int32 code = 1;
  // 0 if it exited by itself.
  int32 signal = 2;
}

// The agent's cgroup: the agent and every process it started, wherever they moved.
message AgentUsage {
  // CPU time since the boot's first agent start.
  uint64 cpu_usec = 1;
  // memory.current without inactive file cache, which the kernel can reclaim.
  uint64 memory_bytes = 2;
  // Processes the kernel ended because the cgroup ran out of memory.
  uint64 oom_kills = 3;
}

// The activity collector. There is none yet, so the supervisor reports NOT_INSTALLED.
enum CollectorState {
  COLLECTOR_STATE_UNSPECIFIED = 0;
  COLLECTOR_STATE_NOT_INSTALLED = 1;
  COLLECTOR_STATE_RUNNING = 2;
  // Running, but its events stopped advancing.
  COLLECTOR_STATE_STALLED = 3;
  COLLECTOR_STATE_STOPPED = 4;
}
