[package]
name = "guest_supervisor"
description = "The guest supervisor (agentarium-supervisor), baked into the base rootfs: starts the boot mode the app sends over the command plane."
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# Linux guest only: built for aarch64-unknown-linux-musl by `make rootfs`.
[[bin]]
name = "agentarium-supervisor"
path = "src/main.rs"

[dependencies]
command_plane = { path = "../command_plane" }
libc = "0.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
