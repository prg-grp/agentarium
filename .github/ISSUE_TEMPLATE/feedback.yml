name: Feedback
description: Report a bug, request a feature or send general feedback.
body:
  # Agentarium fills this in through the ?version= URL parameter (Preferences → Feedback).
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Agentarium under Preferences → Updates.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of feedback
      options:
        - Bug
        - Feature request
        - General feedback
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: For a bug, include what you did, what you expected and what happened instead.
    validations:
      required: true
