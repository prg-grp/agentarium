# Release pipeline. Every push to main runs release-please first:
# - merging its release PR creates the vX.Y.Z tag and a draft release → stable build into
#   that draft, which Velopack publishes once everything is uploaded;
# - creating or updating its release PR → dev build into a new dev-<run> prerelease, which
#   Velopack creates itself. A failed dev build has its release and tag removed again.
# Both channels are packaged, signed, notarized and uploaded by Velopack; the guest kernel
# and base rootfs are attached to every release for the app to download.
# Everything runs in this one workflow, so github.run_number is the dev build number and no
# PAT is needed (resources created with GITHUB_TOKEN only fail to trigger *other* workflows).
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/${{ github.repository }}
  VPK_VERSION: 1.2.161

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      prev_tag: ${{ steps.decide.outputs.prev_tag }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          RELEASE_CREATED: ${{ steps.rp.outputs.release_created }}
          PRS_CREATED: ${{ steps.rp.outputs.prs_created }}
          RELEASE_TAG: ${{ steps.rp.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.rp.outputs.version }}
          RELEASE_BODY: ${{ steps.rp.outputs.body }}
          RELEASE_PR: ${{ steps.rp.outputs.pr }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p notes
          if [ "$RELEASE_CREATED" = "true" ]; then
            git fetch --tags --force
            # The previous stable release, for delta packages (none before the first one).
            prev=$(git describe --tags --abbrev=0 --match 'v*' "$RELEASE_TAG^" 2>/dev/null || true)
            printf '%s\n' "$RELEASE_BODY" > notes/notes.md
            {
              echo "mode=stable"
              echo "version=$RELEASE_VERSION"
              echo "tag=$RELEASE_TAG"
              echo "prev_tag=$prev"
            } >> "$GITHUB_OUTPUT"
          elif [ "$PRS_CREATED" = "true" ]; then
            # The version the release PR will ship, with the run number as dev build number.
            # release-please names the branch itself, so take it from the PR it reported.
            branch=$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")
            if [ -z "$branch" ]; then
              echo "release-please reported no release PR branch" >&2
              exit 1
            fi
            git fetch origin "$branch"
            next=$(git show FETCH_HEAD:.release-please-manifest.json | jq -r '."."')
            version="$next-dev.$RUN_NUMBER"
            # A re-run of a finished build must not fail later and have its release cleaned up.
            if git ls-remote --exit-code --tags origin "refs/tags/dev-$RUN_NUMBER" >/dev/null; then
              echo "dev-$RUN_NUMBER already exists; refusing to rebuild it" >&2
              exit 1
            fi
            # Deltas build on the previous dev release; the notes list what is new since the
            # previous dev or stable release, whichever is nearer.
            prev=$(git describe --tags --abbrev=0 --match 'dev-*' HEAD 2>/dev/null || true)
            base=$(git describe --tags --abbrev=0 --match 'dev-*' --match 'v*' HEAD 2>/dev/null || true)
            range="${base:+$base..}HEAD"
            section() {
              local lines
              lines=$(git log --no-merges --format='%s' "$range" \
                | grep -E "^($1)(\([^)]*\))?!?: " \
                | sed -E 's/^[a-z]+(\(([^)]*)\))?!?: (.*)$/- \3/' || true)
              if [ -n "$lines" ]; then printf '### %s\n\n%s\n\n' "$2" "$lines"; fi
            }
            {
              section feat Features
              section fix "Bug Fixes"
              section perf Performance
            } > notes/notes.md
            if [ ! -s notes/notes.md ]; then
              echo "No user-facing changes since the previous build." > notes/notes.md
            fi
            {
              echo "mode=dev"
              echo "version=$version"
              echo "tag=dev-$RUN_NUMBER"
              echo "prev_tag=$prev"
            } >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.decide.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes/notes.md

  guest:
    needs: plan
    if: needs.plan.outputs.mode != 'none'
    runs-on: ubuntu-24.04-arm
    outputs:
      kernel_sha256: ${{ steps.hashes.outputs.kernel }}
      rootfs_sha256: ${{ steps.hashes.outputs.rootfs }}
    steps:
      - uses: actions/checkout@v4

      # Rebuilt only when something that ends up in the guest changes.
      - id: cache
        uses: actions/cache@v4
        with:
          path: dist/guest
          key: guest-${{ hashFiles('Makefile', 'Cargo.lock', 'scripts/build-guest.sh', 'scripts/gen-vmlinux.sh', 'vms/rootfs/**', 'guest_supervisor/**', 'guest_observer/**', 'guest_observer_common/**', 'guest_observer_ebpf/**', 'command_plane/**', 'data_plane/**') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - if: steps.cache.outputs.cache-hit != 'true'
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: cargo-bins/cargo-binstall@main

      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo binstall -y bpf-linker

      # The runner's resolver often times out on ubuntu.com (Canonical's name servers are
      # partly unreachable from it). Docker containers take this file over as well.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Use public DNS resolvers
        run: |
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 9.9.9.9\noptions timeout:3 attempts:3\n' | sudo tee /etc/resolv.conf

      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build kernel and base rootfs
        run: make guest

      # The rootfs is a sparse image just bigger than its 1-2G of data; zstd turns the holes
      # into almost nothing. The app checks the compressed files against these hashes.
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Package guest assets
        run: |
          set -euo pipefail
          mkdir -p dist/guest
          zstd -q -T0 -19 target/guest/Image -o dist/guest/agentarium-kernel.zst
          zstd -q -T0 -12 --long=27 target/rootfs/base.ext4 -o dist/guest/agentarium-rootfs.ext4.zst
          cd dist/guest
          jq -n \
            --arg ks "$(sha256sum agentarium-kernel.zst | cut -d' ' -f1)" \
            --arg rs "$(sha256sum agentarium-rootfs.ext4.zst | cut -d' ' -f1)" \
            --argjson kn "$(stat -c %s agentarium-kernel.zst)" \
            --argjson rn "$(stat -c %s agentarium-rootfs.ext4.zst)" \
            '{kernel: {file: "agentarium-kernel.zst", sha256: $ks, size: $kn},
              rootfs: {file: "agentarium-rootfs.ext4.zst", sha256: $rs, size: $rn}}' > guest.json

      - id: hashes
        run: |
          echo "kernel=$(jq -r .kernel.sha256 dist/guest/guest.json)" >> "$GITHUB_OUTPUT"
          echo "rootfs=$(jq -r .rootfs.sha256 dist/guest/guest.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: guest
          path: dist/guest
          compression-level: 0

  app:
    needs: [plan, guest]
    if: needs.plan.outputs.mode != 'none'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      MODE: ${{ needs.plan.outputs.mode }}
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      PREV_TAG: ${{ needs.plan.outputs.prev_tag }}
      CHANNEL: ${{ needs.plan.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: guest
          path: dist/guest
      - uses: actions/download-artifact@v4
        with:
          name: notes
          path: dist

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "26.0"
          AGENTARIUM_VERSION: ${{ needs.plan.outputs.version }}
          AGENTARIUM_CHANNEL: ${{ needs.plan.outputs.mode }}
          AGENTARIUM_RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          AGENTARIUM_KERNEL_SHA256: ${{ needs.guest.outputs.kernel_sha256 }}
          AGENTARIUM_ROOTFS_SHA256: ${{ needs.guest.outputs.rootfs_sha256 }}
        run: cargo build --release -p app --target aarch64-apple-darwin

      - name: Prepare bundle inputs
        run: |
          set -euo pipefail
          mkdir -p dist/pack dist/AppIcon.iconset
          cp target/aarch64-apple-darwin/release/Agentarium dist/pack/
          for size in 16 32 128 256; do
            sips -z $size $size app/ui/app-icon.png --out dist/AppIcon.iconset/icon_${size}x${size}.png >/dev/null
            sips -z $((size * 2)) $((size * 2)) app/ui/app-icon.png --out dist/AppIcon.iconset/icon_${size}x${size}@2x.png >/dev/null
          done
          cp app/ui/app-icon.png dist/AppIcon.iconset/icon_512x512.png
          iconutil -c icns dist/AppIcon.iconset -o dist/AppIcon.icns
          # As vpk does for its own Info.plist: the short version without the dev suffix.
          cp app/Info.plist dist/Info.plist
          plutil -replace CFBundleShortVersionString -string "${VERSION%%-*}" dist/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" dist/Info.plist

      - name: Import signing certificates
        env:
          APP_CERT: ${{ secrets.MACOS_APP_CERT_P12 }}
          INSTALLER_CERT: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          password=$(uuidgen)
          security create-keychain -p "$password" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$password" "$KEYCHAIN"
          for cert in "$APP_CERT" "$INSTALLER_CERT"; do
            echo "$cert" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/pkgbuild -T /usr/bin/productbuild
          done
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$KEYCHAIN" >/dev/null
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${keychains[@]}"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials agentarium --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --keychain "$KEYCHAIN"
          rm "$RUNNER_TEMP/AuthKey.p8"
          app_identity=$(security find-identity -v "$KEYCHAIN" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          installer_identity=$(security find-identity -v "$KEYCHAIN" | grep -o '"Developer ID Installer: [^"]*"' | head -1 | tr -d '"')
          echo "APP_IDENTITY=$app_identity" >> "$GITHUB_ENV"
          echo "INSTALLER_IDENTITY=$installer_identity" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk --version "$VPK_VERSION"

      # The previous release of the same channel, so vpk can build a delta package from it.
      - name: Download previous release
        if: needs.plan.outputs.prev_tag != ''
        continue-on-error: true
        run: vpk download http --url "$REPO_URL/releases/download/$PREV_TAG" --channel "$CHANNEL" -o dist/releases

      - name: Pack, sign and notarize
        run: |
          set -euo pipefail
          # Dev builds skip the .pkg installer and its second notarization: updates only need
          # the packages, and the portable zip installs a dev build directly.
          extra=()
          if [ "$MODE" = "dev" ]; then
            extra=(--noInst)
          elif [ -f LICENSE ]; then
            extra=(--instLicense LICENSE)
          fi
          vpk pack \
            --packId Agentarium --packVersion "$VERSION" --packTitle Agentarium \
            --channel "$CHANNEL" --packDir dist/pack --mainExe Agentarium \
            --icon dist/AppIcon.icns --plist dist/Info.plist --releaseNotes dist/notes.md \
            --signEntitlements app/agent-toolbox.entitlements \
            --signAppIdentity "$APP_IDENTITY" --signInstallIdentity "$INSTALLER_IDENTITY" \
            --notaryProfile agentarium --keychain "$KEYCHAIN" \
            ${extra[@]+"${extra[@]}"} -o dist/releases

      # Velopack creates the dev release (titled with the version, notes from the package) and
      # merges into the stable draft release-please created; both are published afterwards.
      - name: Upload
        run: |
          set -euo pipefail
          pre=()
          if [ "$MODE" = "dev" ]; then pre=(--pre); fi
          vpk upload github --repoUrl "$REPO_URL" --token "$GH_TOKEN" --channel "$CHANNEL" \
            --tag "$TAG" --releaseName "$VERSION" --targetCommitish "$GITHUB_SHA" \
            --merge --publish ${pre[@]+"${pre[@]}"} -o dist/releases
          gh release upload "$TAG" dist/guest/agentarium-kernel.zst dist/guest/agentarium-rootfs.ext4.zst dist/guest/guest.json --clobber

      - name: Remove keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" 2>/dev/null || true

  # Removes the release (draft or published) and tag of a failed dev build, so a re-run starts
  # clean. Failed stable builds are left for manual cleanup.
  cleanup:
    needs: [plan, app]
    if: always() && needs.plan.outputs.mode == 'dev' && (needs.app.result == 'failure' || needs.app.result == 'cancelled')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
